{% extends 'chat/main_base.html' %}

{% block title %}{{ room_name }}{% endblock %}

{% block extra_css %}
<style>
    body {
        background: #f5f7fb;
    }

    .chat-container {
        background: white;
        border-radius: 28px;
        box-shadow: 0 20px 35px rgba(0, 0, 0, 0.15);
        overflow: hidden;
        animation: fadeInUp 0.4s ease-out;
    }

    .chat-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 20px 28px;
        color: white;
    }

    .chat-header h2 {
        margin: 0;
        font-size: 1.7rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .chat-header h2:before {
        content: "💬";
        font-size: 1.5rem;
    }

    .chat-header .alert-info {
        background: rgba(255,255,255,0.2);
        border-radius: 40px;
        padding: 6px 16px;
        display: inline-block;
        margin-top: 12px;
        font-size: 0.85rem;
        font-weight: 500;
        backdrop-filter: blur(4px);
    }

    .ws-status {
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(4px);
        padding: 5px 14px;
        border-radius: 40px;
        font-size: 0.75rem;
        font-weight: 600;
        color: white;
        white-space: nowrap;
    }

    .ws-status.connected {
        background: #28a745;
    }
    .ws-status.disconnected {
        background: #dc3545;
    }

    .chat-log {
        height: 480px;
        overflow-y: auto;
        padding: 24px 28px;
        background: #fafcff;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .message {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        max-width: 85%;
    }

    .message-mine {
        align-self: flex-end;
        flex-direction: row-reverse;
    }

    .message-avatar {
        flex-shrink: 0;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        overflow: hidden;
        background: #e9ecef;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        transition: transform 0.2s;
    }
    .message-avatar:hover {
        transform: scale(1.05);
    }
    .avatar-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .avatar-placeholder {
        font-size: 1.5rem;
        line-height: 1;
    }

    .message-content {
        flex: 0 1 auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .message-mine .message-content {
        align-items: flex-end;
    }

    .message-header {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
    }

    .message-username-link {
        font-weight: 700;
        color: #667eea;
        text-decoration: none;
        font-size: 0.9rem;
        transition: color 0.2s;
    }
    .message-username-link:hover {
        color: #4c51bf;
        text-decoration: underline;
    }
    .message-mine .message-username-link {
        color: #5a67d8;
    }

    .message-time {
        font-size: 0.65rem;
        color: #8b9eb0;
    }

    .message-bubble {
        background: white;
        border-radius: 20px;
        padding: 8px 16px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        border: 1px solid #e9ecef;
        word-wrap: break-word;
        max-width: 100%;
    }

    .message-mine .message-bubble {
        background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
        border: none;
        color: #1e1e2f;
    }

    .message-text {
        font-size: 0.95rem;
        line-height: 1.4;
        word-break: break-word;
    }

    .file-message {
        background: #f1f5f9;
        border-radius: 14px;
        padding: 8px 12px;
        margin-top: 6px;
    }
    .file-image-preview {
        max-width: 200px;
        max-height: 150px;
        border-radius: 12px;
        margin-top: 8px;
        cursor: pointer;
        border: 1px solid #ddd;
    }

    .input-area {
        padding: 20px 28px;
        background: white;
        border-top: 1px solid #edf2f7;
    }

    .input-group-custom {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
    }

    .input-group-custom .form-control {
        flex: 1;
        padding: 12px 18px;
        border: 2px solid #e2e8f0;
        border-radius: 40px;
        font-size: 0.95rem;
        transition: all 0.2s;
    }

    .input-group-custom .form-control:focus {
        border-color: #667eea;
        outline: none;
        box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
    }

    .btn-custom {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        color: white;
        padding: 0 24px;
        border-radius: 40px;
        font-weight: 600;
        transition: transform 0.2s, box-shadow 0.2s;
        cursor: pointer;
        font-size: 0.9rem;
    }

    .btn-custom:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(102,126,234,0.4);
    }

    .btn-secondary-custom {
        background: #4a5568;
    }

    .btn-secondary-custom:hover {
        background: #2d3748;
    }

    .file-row {
        margin-top: 12px;
    }

    @media (max-width: 640px) {
        .chat-header h2 {
            font-size: 1.3rem;
        }
        .ws-status {
            position: static;
            display: inline-block;
            margin-left: 12px;
        }
        .chat-log {
            height: 450px;
            padding: 16px;
        }
        .message {
            max-width: 95%;
            gap: 8px;
        }
        .message-avatar {
            width: 32px;
            height: 32px;
            font-size: 1.2rem;
        }
        .input-group-custom {
            flex-direction: column;
        }
        .btn-custom {
            padding: 10px 20px;
        }
    }

    @media (max-width: 576px) {
        .container {
            padding-left: 0 !important;
            padding-right: 0 !important;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        .chat-container {
            border-radius: 0;
            width: 100%;
            margin: 0;
        }

        .chat-header {
            padding: 12px 16px;
        }

        .chat-header h2 {
            font-size: 1.2rem;
            gap: 8px;
        }

        .chat-header h2:before {
            font-size: 1.2rem;
        }

        .ws-status {
            font-size: 0.7rem;
            padding: 4px 10px;
        }
        .chat-log {
            height: 65vh;
            padding: 12px;
            gap: 12px;
        }
        .message {
            gap: 6px;
            max-width: 98%;
        }
        .message-avatar {
            width: 28px;
            height: 28px;
            font-size: 1.1rem;
        }
        .avatar-placeholder {
            font-size: 1rem;
        }
        .message-content {
            flex: 1;
            min-width: 0;
        }
        .message-username-link {
            font-size: 0.85rem;
        }
        .message-time {
            font-size: 0.6rem;
        }
        .message-bubble {
            padding: 6px 12px;
            border-radius: 18px;
            word-break: break-word;
        }
        .message-text {
            font-size: 0.9rem;
        }

        .file-message {
            padding: 6px 10px;
        }
        .file-image-preview {
            max-width: 100%;
            height: auto;
        }

        .input-area {
            padding: 12px 16px;
        }
        .input-group-custom .form-control {
            padding: 10px 14px;
            font-size: 0.9rem;
        }
        .btn-custom {
            padding: 10px 16px;
            font-size: 0.9rem;
        }
        .file-row {
            margin-top: 8px;
        }
    }

    @media (max-width: 480px) {
        .chat-log {
            height: 60vh;
            padding: 8px;
        }
        .message-avatar {
            width: 28px;
            height: 28px;
            font-size: 1rem;
        }
        .message-bubble {
            padding: 5px 10px;
        }
        .message-text {
            font-size: 0.85rem;
        }
        .input-area {
            padding: 10px 12px;
        }
        .btn-custom {
            padding: 8px 12px;
            font-size: 0.8rem;
        }
        .input-group-custom .form-control {
            padding: 8px 12px;
            font-size: 0.85rem;
        }
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="chat-container">
        <div class="chat-header">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
                <h2>Комната: {{ room_name }}</h2>
                <div class="ws-status" id="ws-status">Подключение...</div>
            </div>
        </div>

        <div id="chat-log" class="chat-log"></div>

        <div class="input-area">
            <div class="input-group-custom">
                <input type="text" id="chat-message-input" class="form-control" placeholder="Ваше сообщение...">
                <button id="chat-message-submit" class="btn-custom">Отправить</button>
            </div>
            <div class="input-group-custom file-row">
                <input type="file" id="file-input" class="form-control">
                <button id="file-submit" class="btn-custom btn-secondary-custom">Отправить файл</button>
            </div>
        </div>
    </div>
</div>

{{ room_name|json_script:"room-name" }}
{{ username|json_script:"username" }}

<script>
    (function() {
        let roomName, username;
        try {
            roomName = JSON.parse(document.getElementById('room-name').textContent);
            username = JSON.parse(document.getElementById('username').textContent);
        } catch(e) {
            console.error('Ошибка чтения данных', e);
            document.body.innerHTML = '<div style="color:red;padding:20px;">Ошибка загрузки чата. Проверьте консоль.</div>';
            return;
        }

        const wsProtocol = location.protocol === 'https:' ? 'wss' : 'ws';
        const wsUrl = `${wsProtocol}://${location.host}/ws/chat/${encodeURIComponent(roomName)}/?username=${encodeURIComponent(username)}`;
        let chatSocket = null;
        let reconnectTimer = null;
        let isClosing = false;

        function updateStatus(connected) {
            const statusDiv = document.getElementById('ws-status');
            if (statusDiv) {
                statusDiv.textContent = connected ? 'Соединение установлено' : 'Соединение потеряно';
                statusDiv.className = `ws-status ${connected ? 'connected' : 'disconnected'}`;
            }
        }

        function connectWebSocket() {
            if (chatSocket && chatSocket.readyState === WebSocket.OPEN) return;
            if (reconnectTimer) clearTimeout(reconnectTimer);

            chatSocket = new WebSocket(wsUrl);
            chatSocket.onopen = () => {
                console.log('WebSocket открыт');
                isClosing = false;
                updateStatus(true);
            };
            chatSocket.onmessage = (e) => {
                console.log('Получено сообщение:', e.data);
                try {
                    const data = JSON.parse(e.data);
                    if (data.type === 'history') {
                        const logDiv = document.getElementById('chat-log');
                        if (logDiv) {
                            logDiv.innerHTML = '';
                            data.messages.forEach(msg => appendMessage(msg));
                        }
                    } else if (data.type === 'text') {
                        appendMessage({
                            type: 'text',
                            username: data.username,
                            content: data.content,
                            timestamp: data.timestamp,
                            avatar: data.avatar
                        });
                    } else if (data.type === 'file') {
                        appendMessage({
                            type: 'file',
                            username: data.username,
                            file_url: data.file_url,
                            file_name: data.file_name,
                            file_size: data.file_size,
                            timestamp: data.timestamp,
                            avatar: data.avatar
                        });
                    }
                } catch(err) { console.error('Ошибка обработки сообщения', err); }
            };
            chatSocket.onclose = (e) => {
                if (!isClosing) {
                    console.warn('WebSocket закрыт, переподключение...');
                    updateStatus(false);
                    reconnectTimer = setTimeout(connectWebSocket, 2000);
                }
            };
            chatSocket.onerror = (e) => { console.error('Ошибка WebSocket', e); chatSocket.close(); };
        }

        function appendMessage(msg) {
            const logDiv = document.getElementById('chat-log');
            if (!logDiv) return;

            const isMine = (msg.username === username);
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isMine ? 'message-mine' : ''}`;

            const avatarLink = document.createElement('a');
            avatarLink.href = `/profile/view/${encodeURIComponent(msg.username)}/`;
            avatarLink.className = 'message-avatar';
            avatarLink.style.textDecoration = 'none';

            if (msg.avatar) {
                const img = document.createElement('img');
                img.src = msg.avatar;
                img.alt = msg.username;
                img.className = 'avatar-img';
                img.onerror = function() {
                    this.style.display = 'none';
                    const placeholder = document.createElement('span');
                    placeholder.className = 'avatar-placeholder';
                    placeholder.textContent = '👤';
                    avatarLink.innerHTML = '';
                    avatarLink.appendChild(placeholder);
                };
                avatarLink.appendChild(img);
            } else {
                const placeholder = document.createElement('span');
                placeholder.className = 'avatar-placeholder';
                placeholder.textContent = '👤';
                avatarLink.appendChild(placeholder);
            }

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            const headerDiv = document.createElement('div');
            headerDiv.className = 'message-header';

            const nameLink = document.createElement('a');
            nameLink.href = `/profile/view/${encodeURIComponent(msg.username)}/`;
            nameLink.className = 'message-username-link';
            nameLink.textContent = escapeHtml(msg.username);
            headerDiv.appendChild(nameLink);

            const timeSpan = document.createElement('span');
            timeSpan.className = 'message-time';
            if (msg.timestamp) {
                timeSpan.textContent = new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            }
            headerDiv.appendChild(timeSpan);

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';

            if (msg.type === 'text') {
                const textDiv = document.createElement('div');
                textDiv.className = 'message-text';
                textDiv.textContent = msg.content;
                bubbleDiv.appendChild(textDiv);
            } else if (msg.type === 'file') {
                const fileDiv = document.createElement('div');
                fileDiv.className = 'file-message';
                const fileLink = document.createElement('a');
                fileLink.href = escapeHtml(msg.file_url);
                fileLink.target = '_blank';
                fileLink.textContent = escapeHtml(msg.file_name);
                fileDiv.appendChild(fileLink);

                const sizeSpan = document.createElement('span');
                sizeSpan.style.fontSize = '0.7rem';
                sizeSpan.style.marginLeft = '8px';
                sizeSpan.textContent = `(${formatFileSize(msg.file_size)})`;
                fileDiv.appendChild(sizeSpan);

                if (msg.file_url && msg.file_url.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
                    const preview = document.createElement('img');
                    preview.src = msg.file_url;
                    preview.className = 'file-image-preview';
                    preview.alt = 'preview';
                    preview.style.display = 'block';
                    preview.style.marginTop = '8px';
                    fileDiv.appendChild(preview);
                }
                bubbleDiv.appendChild(fileDiv);
            }

            contentDiv.appendChild(headerDiv);
            contentDiv.appendChild(bubbleDiv);
            messageDiv.appendChild(avatarLink);
            messageDiv.appendChild(contentDiv);
            logDiv.appendChild(messageDiv);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function escapeHtml(s) { return String(s).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
        function formatFileSize(b) { if (!b) return '0 B'; if (b < 1024) return b + ' B'; if (b < 1048576) return (b/1024).toFixed(1) + ' KB'; return (b/1048576).toFixed(1) + ' MB'; }
        function getCookie(name) { let v = null; if (document.cookie) { for(let c of document.cookie.split(';')) { c = c.trim(); if (c.startsWith(name+'=')) { v = decodeURIComponent(c.substring(name.length+1)); break; } } } return v; }

        const textInput = document.getElementById('chat-message-input');
        const textSubmit = document.getElementById('chat-message-submit');
        if (textInput && textSubmit) {
            textInput.focus();
            textInput.onkeyup = (e) => { if (e.key === 'Enter') textSubmit.click(); };
            textSubmit.onclick = () => {
                const message = textInput.value.trim();
                if (!message) return;
                if (chatSocket && chatSocket.readyState === WebSocket.OPEN) {
                    chatSocket.send(JSON.stringify({ type: 'text', message: message }));
                    textInput.value = '';
                } else { alert('Соединение не установлено'); }
            };
        }

        const fileInput = document.getElementById('file-input');
        const fileSubmit = document.getElementById('file-submit');
        if (fileInput && fileSubmit) {
            fileSubmit.onclick = async () => {
                const file = fileInput.files[0];
                if (!file) return;
                if (!chatSocket || chatSocket.readyState !== WebSocket.OPEN) { alert('Соединение не установлено'); return; }

                const fd = new FormData();
                fd.append('file', file);
                fileSubmit.disabled = true;
                fileSubmit.textContent = 'Загрузка...';
                try {
                    const resp = await fetch(`/chat/${encodeURIComponent(roomName)}/upload/`, {
                        method: 'POST',
                        body: fd,
                        headers: { 'X-CSRFToken': getCookie('csrftoken') }
                    });
                    const data = await resp.json();
                    if (resp.ok) {
                        chatSocket.send(JSON.stringify({
                            type: 'file',
                            file_url: data.url,
                            file_name: data.name,
                            file_size: data.size
                        }));
                        fileInput.value = '';
                    } else {
                        alert('Ошибка: ' + (data.error || 'неизвестная'));
                    }
                } catch (err) {
                    console.error(err);
                    alert('Ошибка загрузки файла');
                } finally {
                    fileSubmit.disabled = false;
                    fileSubmit.textContent = 'Отправить файл';
                }
            };
        }

        window.addEventListener('beforeunload', () => { if (chatSocket) { isClosing = true; chatSocket.close(); } if (reconnectTimer) clearTimeout(reconnectTimer); });
        connectWebSocket();
    })();
</script>
{% endblock %}
